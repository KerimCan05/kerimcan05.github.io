<!DOCTYPE html>

                    </div>

                    </div>

                        <a class="btn btn-primary" href="https://getbootstrap.com/" role="button">Bootstrap</a>
                        <a class="btn btn-primary" href="https://github.com/KerimCan05/kerimcanozkurt.rf.gd" role="button">Page source</a>
                        <a class="btn btn-primary" href="https://canozkurt.neocities.org/" role="button">Visit old website</a>

                <script>
                    fetch('elements/clock.html')
                    .then(r => r.text())
                    .then(html => document.getElementById('clock').innerHTML = html);

                        <div class="card-title">Last.Fm</div>

                                <li class="list-group-item bg-transparent py-1" id="artistName"></li>
                                <li class="list-group-item bg-transparent py-1" id="albumName"></li>
