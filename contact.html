<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Can Özkurt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">s
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <script src="js/clock.js"></script>
</head>
<body background="images/background.jpg" style="background-repeat: no-repeat; background-size: cover; background-position: center; background-attachment: fixed;">
    <div class="container">
        <div id="header"></div>
        <script>
            fetch('elements/header.html')
            .then(r => r.text())
            .then(html => document.getElementById('header').innerHTML = html);
        </script>

        <div class="row mt-4 justify-content-around">
            <div class="col-12 col-md-8 mb-4">
                <div class="card mb-3 bg-secondary bg-opacity-10">
                    <div class="card-header">
                        <div class="card-title h1 text-white">Contact</div>
                    </div>
                </div>
                <div class="card mb-3 bg-secondary bg-opacity-10">
                    <div class="card-header">
                        <div class="card-title text-white">E-Mail</div>
                    </div>
                    <div class="card-body text-white text-center">
                        <button type="button" class="btn btn-primary mb-1" data-bs-toggle="modal" data-bs-target="#mailm">kerim.can.ozkurt0@gmail.com</button>
                        <a class="btn btn-primary mb-1" href="mailto:kerim_can05@proton.me" role="button">kerim_can05@proton.me</a>
                    </div>
                </div>
                <div class="card mb-3 bg-secondary bg-opacity-10">
                    <div class="card-header">
                        <div class="card-title text-white">Social Media</div>
                    </div>
                    <div class="card-body text-white text-center">
                        <a class="btn btn-primary mb-1" href="https://github.com/KerimCan05" role="button">github/@KerimCan05</a>
                        <a class="btn btn-primary mb-1" href="https://www.linkedin.com/in/can-ozkurt/" role="button">linkedin/can-ozkurt</a>
                        <a class="btn btn-primary mb-1" href="https://matrix.to/#/@kerimcan05:matrix.org" role="button">@kerimcan05:matrix.org</a>
                    </div>
                </div>

            </div>
            <div class="col-12 col-md-4">
                <div id="clock"></div>
                <script>
                    fetch('elements/clock.html')
                    .then(r => r.text())
                    .then(html => document.getElementById('clock').innerHTML = html);
                </script>
            </div>
        </div>

        <div id="footer"></div>
        <script>
            fetch('elements/footer.html')
            .then(r => r.text())
            .then(html => document.getElementById('footer').innerHTML = html);
        </script>

        <div class="modal fade" id="mailm" tabindex="-1" role="dialog" aria-labelledby="mailmLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <p>Use proton.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">OK.</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
