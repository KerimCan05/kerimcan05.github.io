<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Can Özkurt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.grid.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <script src="js/clock.js"></script>

</head>
<body background="images/background.jpg" style="background-repeat: no-repeat; background-size: cover; background-position: center; background-attachment: fixed;">
    <div class="container">
        <div id="header"></div>
        <script>
            fetch('elements/header.html')
            .then(r => r.text())
            .then(html => document.getElementById('header').innerHTML = html);
        </script>

        <div class="row mt-4 justify-content-around">
            <div class="col-12 col-md-8 mb-4">
                <div class="card mb-3 bg-secondary bg-opacity-10">
                    <div class="card-header">
                        <div class="card-title h1 text-white">Projects</div>
                    </div>
                </div>

                <div class="card mb-3 text-white bg-secondary bg-opacity-10 p-1">
                    <div class="row g-0">
                        <div class="col-md-4">
                            <img src="images/projects/pocket.jpg" class="img-fluid rounded-start" alt="Artado Pocket">
                        </div>
                        <div class="col-12 col-md-8">
                            <div class="card-body">
                                <h5 class="card-title">Artado Pocket</h5>
                                <p class="card-text">Freedom of Artado, is in palm of your hand.</p>
                                <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#pocketm">In Development</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card text-white bg-secondary bg-opacity-10 p-1">
                    <div class="row g-0">
                        <div class="col-md-4 carousel slide" data-bs-ride="carousel">
                            <div class="carousel-inner">
                                <div class="carousel-item active"><img src="/images/projects/waterCalendar/1.png" alt="Main Page" class="w-100"></div>
                                <div class="carousel-item"><img src="/images/projects/waterCalendar/2.png" alt="Calendar" class="w-100"></div>
                            </div>
                        </div>
                        <div class="col-8 col-md-8">
                            <div class="card-body">
                                <h5 class="card-title">Water Calendar</h5>
                                <p class="card-text">Keep track of how much water you drink and check it on a daily view calendar. Made with Flutter.</p>
                                <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#calendardownload">Download</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="col-12 col-md-4">
                <div id="clock"></div>
                <script>
                    fetch('elements/clock.html')
                    .then(r => r.text())
                    .then(html => document.getElementById('clock').innerHTML = html);
                </script>
            </div>
        </div>

        <div id="footer"></div>
        <script>
            fetch('elements/footer.html')
            .then(r => r.text())
            .then(html => document.getElementById('footer').innerHTML = html);
        </script>
    </div>

    <div class="modal fade" id="pocketm" tabindex="-1" role="dialog" aria-labelledby="pocketmLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <p>Not Coming Soon. Check Artado Discord.</p>
                </div>
                <div class="modal-body">
                    <div id="caroPocket" class="carousel slide carousel-dark">
                        <div class="carousel-inner">
                            <div class="carousel-item active"><img src="images/pocket/d1.webp" class="d-block w-100" alt="Search Page Dark"></div>
                            <div class="carousel-item"><img src="images/pocket/l1.webp" class="d-block w-100" alt="Search Page Light"></div>
                            <div class="carousel-item"><img src="images/pocket/d2.webp" class="d-block w-100" alt="Results Page Dark"></div>
                            <div class="carousel-item"><img src="images/pocket/l2.webp" class="d-block w-100" alt="Results Page Light"></div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#caroPocket" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#caroPocket" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <a type="button" href="https://discord.com/invite/WXCsr8zTN6" class="btn btn-sm btn-primary">Discord</a>
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="calendardownload" tabindex="-1" role="dialog" aria-labelledby="pocketmLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <p>Download from Github</p>
                </div>
                <div class="modal-footer">
                    <a type="button" href="https://github.com/KerimCan05/watercalendar/releases/latest" class="btn btn-sm btn-primary">Download</a>
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
